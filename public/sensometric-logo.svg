<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Sensometric Specialities</title>
  <desc id="description">Metallic blue circular Sensometric Specialities emblem.</desc>
  <defs>
    <radialGradient id="outer-metal" cx="38%" cy="28%" r="78%">
      <stop offset="0" stop-color="#f8fcff"/>
      <stop offset=".38" stop-color="#9eb5c9"/>
      <stop offset=".72" stop-color="#344b64"/>
      <stop offset="1" stop-color="#0b1c34"/>
    </radialGradient>
    <linearGradient id="text-ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf3fa"/>
      <stop offset=".46" stop-color="#9eb4c8"/>
      <stop offset="1" stop-color="#d5e3ef"/>
    </linearGradient>
    <radialGradient id="inner-field" cx="38%" cy="24%" r="80%">
      <stop offset="0" stop-color="#294761"/>
      <stop offset=".55" stop-color="#102943"/>
      <stop offset="1" stop-color="#071629"/>
    </radialGradient>
    <linearGradient id="monogram" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7f6ff"/>
      <stop offset=".48" stop-color="#8fcfff"/>
      <stop offset="1" stop-color="#4e80a8"/>
    </linearGradient>
    <filter id="badge-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7"/>
      <feOffset dy="5"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope=".45"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="letter-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/>
      <feOffset dy="3"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope=".65"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <path id="top-arc" d="M 38 256 A 218 218 0 0 1 474 256"/>
    <path id="bottom-arc" d="M 38 256 A 218 218 0 0 0 474 256"/>
  </defs>

  <g filter="url(#badge-shadow)">
    <circle cx="256" cy="256" r="248" fill="#071629" stroke="#d5e7f5" stroke-width="4"/>
    <circle cx="256" cy="256" r="238" fill="url(#outer-metal)" stroke="#17334e" stroke-width="5"/>
    <circle cx="256" cy="256" r="220" fill="url(#text-ring)" stroke="#eef7ff" stroke-width="3"/>
    <circle cx="256" cy="256" r="183" fill="#0b1c34" stroke="#183a59" stroke-width="7"/>
    <circle cx="256" cy="256" r="169" fill="url(#inner-field)" stroke="#8fcfff" stroke-opacity=".42" stroke-width="2"/>
  </g>

  <g fill="none" stroke="#a8d7f7" stroke-opacity=".38">
    <circle cx="256" cy="256" r="154" stroke-width="1"/>
    <circle cx="256" cy="256" r="137" stroke-dasharray="2 8" stroke-width="1.5"/>
  </g>
  <g stroke="#294d6c" stroke-width="2" opacity=".8">
    <path d="M256 70v10" transform="rotate(0 256 256)"/>
    <path d="M256 70v10" transform="rotate(15 256 256)"/>
    <path d="M256 70v10" transform="rotate(30 256 256)"/>
    <path d="M256 70v10" transform="rotate(45 256 256)"/>
    <path d="M256 70v10" transform="rotate(60 256 256)"/>
    <path d="M256 70v10" transform="rotate(75 256 256)"/>
    <path d="M256 70v10" transform="rotate(90 256 256)"/>
    <path d="M256 70v10" transform="rotate(105 256 256)"/>
    <path d="M256 70v10" transform="rotate(120 256 256)"/>
    <path d="M256 70v10" transform="rotate(135 256 256)"/>
    <path d="M256 70v10" transform="rotate(150 256 256)"/>
    <path d="M256 70v10" transform="rotate(165 256 256)"/>
    <path d="M256 70v10" transform="rotate(180 256 256)"/>
    <path d="M256 70v10" transform="rotate(195 256 256)"/>
    <path d="M256 70v10" transform="rotate(210 256 256)"/>
    <path d="M256 70v10" transform="rotate(225 256 256)"/>
    <path d="M256 70v10" transform="rotate(240 256 256)"/>
    <path d="M256 70v10" transform="rotate(255 256 256)"/>
    <path d="M256 70v10" transform="rotate(270 256 256)"/>
    <path d="M256 70v10" transform="rotate(285 256 256)"/>
    <path d="M256 70v10" transform="rotate(300 256 256)"/>
    <path d="M256 70v10" transform="rotate(315 256 256)"/>
    <path d="M256 70v10" transform="rotate(330 256 256)"/>
    <path d="M256 70v10" transform="rotate(345 256 256)"/>
  </g>

  <g fill="#102b45" font-family="Arial, Helvetica, sans-serif" font-weight="800" text-anchor="middle">
    <text font-size="24" letter-spacing="3.1">
      <textPath href="#top-arc" startOffset="50%">SENSOMETRIC</textPath>
    </text>
    <text font-size="22" letter-spacing="2.8">
      <textPath href="#bottom-arc" startOffset="50%">SPECIALITIES</textPath>
    </text>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#letter-shadow)">
    <path d="M 158 333 V 203 L 207 249 L 256 203 L 305 249 L 354 203 V 333" stroke="#234a69" stroke-width="16"/>
    <path d="M 319 187 C 292 163 246 162 216 179 C 184 197 181 225 204 243 C 221 257 250 264 274 273 C 304 284 325 297 315 321 C 304 350 264 362 230 356 C 211 353 194 345 180 333" stroke="url(#monogram)" stroke-width="20"/>
  </g>
  <g fill="#c7e9ff" stroke="#102b45" stroke-width="3">
    <circle cx="158" cy="203" r="8"/>
    <circle cx="354" cy="203" r="8"/>
    <circle cx="158" cy="333" r="8"/>
    <circle cx="354" cy="333" r="8"/>
  </g>
  <g fill="#a9c5df" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="2.4" text-anchor="middle">
    <text x="256" y="393">SALES &amp; DISTRIBUTION</text>
  </g>
</svg>
